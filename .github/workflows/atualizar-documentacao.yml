name: Atualizar Documentação Automática (Gemini - gratuito)

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - '!docs/**'

jobs:
  atualizar-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout do repositório (com histórico completo p/ diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências do script
        run: pip install google-genai

      - name: Gerar/atualizar documentação via IA (Gemini gratuito)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BEFORE_SHA: ${{ github.event.before }}
        run: python scripts/atualizar_docs.py

      - name: Abrir Pull Request com a doc atualizada
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "docs: atualização automática via IA (Gemini)"
          branch: docs/atualizacao-automatica
          title: "Documentação atualizada automaticamente"
          body: |
            Este PR foi gerado automaticamente após mudanças no código-fonte,
            usando o tier gratuito da API do Gemini.
            **Revisar antes de aprovar.**
          delete-branch: true
